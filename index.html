<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- Canonical URL to hint search engines -->
    <link rel="canonical" href="https://cradle-lang.org/">
    <!-- Meta refresh fallback (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=https://cradle-lang.org/">
    <!-- Instant JavaScript redirection -->
    <script>
      window.location.replace("https://cradle-lang.org/" + window.location.pathname.replace(/^\/?/, '') + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>This site has moved to <a href="https://cradle-lang.org/">cradle-lang.org</a>. If you are not redirected automatically, please click the link.</p>
  </body>
</html>
